# FlowSpeak — Cargo workspace root.
# Members are added as each crate is scaffolded (a workspace may only list dirs that exist).
[workspace]
resolver = "2"
members = [
    "crates/flowspeak-ipc",
    "crates/flowspeak-core",
    "crates/flowspeak-audio",
    "crates/flowspeak-asr",
    "crates/flowspeak-cleanup",
    "crates/flowspeak-llm-worker",
    "crates/flowspeak-sidecar",
    "src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["FlowSpeak"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.95"
thiserror = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
